# =========================================
# Fantasy Draft 기본 설정
# =========================================

spring.application.name=fantasy
server.port=8080


# =========================================
# PostgreSQL 연결
# =========================================

# Production에서는 DB_URL, DB_USERNAME, DB_PASSWORD를 설정합니다.
# 로컬에서는 URL과 사용자명 기본값을 사용하고, password는 환경변수로만 제공합니다.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fantasy_draft}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}


# =========================================
# JPA / Hibernate
# =========================================

# Entity 구조를 기준으로 DB 테이블을 생성/업데이트합니다.
spring.jpa.hibernate.ddl-auto=update

# 실행되는 SQL을 IntelliJ 콘솔에 출력합니다.
spring.jpa.show-sql=true

# SQL 정렬
spring.jpa.properties.hibernate.format_sql=true


# =========================================
# UTF-8
# =========================================

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
